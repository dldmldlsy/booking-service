# 예시 설정 파일.
# 복사해 `application.properties`로 만들고 환경별 실제 값으로 채워서 사용하면 됨.
spring.application.name=api

jwt.secret=please-change-me
jwt.access-token-validity-ms=900000
jwt.refresh-token-validity-ms=604800000
token.cleanup-interval-ms=300000

# MySQL 데이터소스 (환경에 맞는 실제 값을 입력)
spring.datasource.url=jdbc:mysql://localhost:3306/booking_service?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=booking
spring.datasource.password=booking
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
